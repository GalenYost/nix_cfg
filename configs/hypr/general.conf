general {
    gaps_in = 3
    gaps_out = 5
    no_border_on_floating = true

    border_size = 2

    col.active_border = rgba(595959aa) 
    col.inactive_border = rgba(595959aa)

    resize_on_border = false
    allow_tearing = false
}

cursor {
    no_hardware_cursors = true
    hide_on_key_press = false
}

decoration {
    rounding = 4
    rounding_power = 2

    blur {
        enabled = true
        size = 8
        passes = 2

        vibrancy = 0.1696
    }
}

input {
    kb_layout = us,ua,ru
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =

    follow_mouse = 1

    sensitivity = -0.3

    touchpad {
        natural_scroll = true
    }
}
