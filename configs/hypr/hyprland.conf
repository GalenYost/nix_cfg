monitor=HDMI-A-1,1920x1080@144,auto,1

$terminal = kitty
$fileManager = thunar
$browser = MOZ_ENABLE_WAYLAND=1 firefox
$menu = fuzzel
$screenshot = grim -g "$(slurp)" - | swappy -f -

exec-once = hyprpaper
exec-once = xsettingsd

general {
    gaps_in = 3
    gaps_out = 6

    border_size = 2

    col.active_border = rgba(595959aa) 
    col.inactive_border = rgba(595959aa)

    resize_on_border = false

    allow_tearing = false

    layout = dwindle
}

cursor {
    no_hardware_cursors = true
    hide_on_key_press = false
    enable_hyprcursor = true
}

decoration {
    rounding = 4
    rounding_power = 2

    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

animations {
    enabled = yes

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 2, default
    animation = border, 1, 2.39, easeOutQuint
    animation = windows, 1, 2.79, easeOutQuint
    animation = windowsIn, 1, 2.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 0.7, linear, popin 87%
    animation = fadeIn, 1, 0.73, almostLinear
    animation = fadeOut, 1, 0.46, almostLinear
    animation = fade, 1, 1.53, quick
    animation = layers, 1, 1.81, easeOutQuint
    animation = layersIn, 1, 2, easeOutQuint, fade
    animation = layersOut, 1, 0.5, linear, fade
    animation = fadeLayersIn, 1, 0.79, almostLinear
    animation = fadeLayersOut, 1, 0.39, almostLinear
    animation = workspaces, 1, 0.94, almostLinear, fade
    animation = workspacesIn, 1, 0.21, almostLinear, fade
    animation = workspacesOut, 1, 0.94, almostLinear, fade
}

dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

input {
    kb_layout = us,ua,ru
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =

    follow_mouse = 1

    sensitivity = -0.3

    touchpad {
        natural_scroll = true
    }
}

gestures {
    workspace_swipe = false
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

$mainMod = SUPER

bind = $mainMod SHIFT, f, togglefloating
bind = $mainMod SHIFT, r, exit
bind = $mainMod SHIFT, e, exec, systemctl suspend

bind = $mainMod, z, exec, $screenshot

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, c, killactive,
bind = $mainMod, f, exec, $fileManager
bind = $mainMod, d, exec, $menu
bind = $mainMod, w, exec, $browser

bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

bind = $mainMod SHIFT, h, swapwindow, l
bind = $mainMod SHIFT, l, swapwindow, r
bind = $mainMod SHIFT, k, swapwindow, u
bind = $mainMod SHIFT, j, swapwindow, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# telegram media viewer float, pinned and no animation
windowrulev2 = float, class:(org.telegram.desktop) title:(Media viewer)
windowrulev2 = noanim, class:(org.telegram.desktop) title:(Media viewer)
windowrulev2 = noblur, class:(org.telegram.desktop) title:(Media viewer)
windowrulev2 = bordersize 0, class:(org.telegram.desktop) title:(Media viewer)

# popup
windowrulev2 = float, class:(Xdg-desktop-portal-gtk)
windowrulev2 = noanim, class:(Xdg-desktop-portal-gtk)
windowrulev2 = noblur, class:(Xdg-desktop-portal-gtk)
windowrulev2 = bordersize 0, class:(Xdg-desktop-portal-gtk)

windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
