[mgr]
show_hidden = true

[opener]
play = [
	{ run = 'mpv "$@"', orphan = true, for = "unix" },
]
edit = [
    { run = 'nvim "$@"', block = true, for = "unix" }
]
open = [
	{ run = 'xdg-open "$@"', desc = "Open" },
]
docx = [
    { run = 'only-office-desktopeditors --view="$@"', desc = "Open docx" },
]

[open]
rules = [
    { name = "*.docx", use = "docx" },
]
